<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172331">
  <title>Your bill · My Market</title>
  <link rel="icon" href="icons/icon-192.png">
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #e9eded; color: #0f1111; }
    header { background: #172331; color: #fff; padding: 14px 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    header img { width: 28px; height: 28px; border-radius: 6px; }
    main { max-width: 480px; margin: 0 auto; padding: 18px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; text-align: center; }
    h1 { font-size: 20px; margin: 6px 0 4px; }
    p { color: #565959; line-height: 1.5; margin: 6px 0; }
    a.btn { display: block; margin-top: 16px; padding: 14px; border-radius: 100px; background: #ffd814; border: 1px solid #f2c200; color: #0f1111; font-weight: 600; text-decoration: none; }
    a.line { background: #fff; border-color: #d5d9d9; font-weight: 500; }
    small { display: block; margin-top: 18px; color: #8a9191; }
  </style>
</head>
<body>
  <header><img src="icons/icon-192.png" alt="">My Market</header>
  <main><div class="card" id="c"><p>Loading your bill…</p></div></main>
  <script src="js/config.js"></script>
  <script>
    // The link carries the file's place after "#": <shop>/<bill>-<random>.pdf
    // …and, after "~", when the link was made (bills stay online for 2 days)
    var parts = decodeURIComponent(location.hash.slice(1)).split("~");
    var path = parts[0], madeAt = parts[1] ? parseInt(parts[1], 36) : 0;
    var expired = function () { return madeAt && Date.now() - madeAt > 47 * 3600000; };
    var shopBtn = '<a class="btn line" href="./#/shop/' + path.split("/")[0] + '?src=bill">See this shop\'s stock and prices</a>';
    var c = document.getElementById("c");
    if (!/^[0-9a-f-]{36}\/[0-9a-f-]{36}-[0-9a-z]{6,20}\.pdf$/.test(path) || !window.MM_CONFIG) {
      c.innerHTML = "<h1>Bill not found</h1><p>This link looks incomplete. Ask the shop to send it again.</p>";
    } else {
      var url = MM_CONFIG.supabaseUrl + "/storage/v1/object/public/bills/" + path;
      var show = function () { c.innerHTML = '<div style="font-size:40px">🧾</div><h1>Your bill is ready</h1><p>Thank you for shopping. Open it below, or save it to your phone.</p>' +
        '<a class="btn" href="' + url + '">Open bill (PDF)</a>' +
        '<a class="btn line" href="' + url + '?download=bill.pdf">Download</a>' +
        '<a class="btn line" href="./#/shop/' + path.split("/")[0] + '?src=bill">See this shop\'s stock and prices</a>' +
        '<a class="btn line" href="./">Find more shops near you on My Market</a>' +
        '<small>Sent by the shop through My Market. Save it to your phone — the link works for 2 days.</small>'; };
      // the shop's phone sends the PDF a moment after the message — wait for it
      var tries = 0;
      var check = function () {
        fetch(url, { method: "HEAD", cache: "no-store" }).then(function (r) {
          if (r.ok) return show();
          if (expired()) { c.innerHTML = '<div style="font-size:40px">🧾</div><h1>This bill link has expired</h1><p>Bill PDFs stay online for 2 days. Ask the shop to send it again — they keep every bill.</p>' + shopBtn; return; }
          if (++tries < 10) { c.innerHTML = '<div style="font-size:40px">⏳</div><h1>Your bill is on its way</h1><p>The shop is sending it — this page opens it as soon as it arrives.</p>'; setTimeout(check, 3000); }
          else c.innerHTML = '<h1>Bill not here yet</h1><p>The shop\'s phone may be offline. Open this link again a little later.</p><a class="btn line" href="./">Find shops near you on My Market</a>';
        }).catch(function () { show(); });
      };
      check();
    }
  </script>
</body>
</html>
